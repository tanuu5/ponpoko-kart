<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Icons &amp; Portraits Test</title>
<style>
  html, body { margin: 0; background: #2b2f38; color: #eee; font: 600 13px/1.3 system-ui, sans-serif; }
  h2 { margin: 14px 16px 6px; font-size: 15px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 10px; }
  .cell { text-align: center; }
  .cell img { display: block; border-radius: 8px;
    background-color: #c9c9c9;
    background-image: linear-gradient(45deg, #9a9a9a 25%, transparent 25%), linear-gradient(-45deg, #9a9a9a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #9a9a9a 75%), linear-gradient(-45deg, transparent 75%, #9a9a9a 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
  .cell span { display: block; margin-top: 3px; }
  #err { color: #f77; white-space: pre-wrap; font: 12px monospace; padding: 8px 16px; }
</style>
</head>
<body>
<h2>Item icons</h2>
<div class="grid" id="items"></div>
<h2>Portraits</h2>
<div class="grid" id="portraits"></div>
<div id="err"></div>
<script type="module" src="./icons-test.js"></script>
</body>
</html>
